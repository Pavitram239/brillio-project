services:
  # Single-Service Web Deployment (FastAPI + React Frontend)
  - type: web
    name: company-research-tool
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
